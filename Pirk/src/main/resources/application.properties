# Application Name
spring.application.name=Pirk

# Server Configuration
server.port=8081
# The port for the application (change if needed)

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pirk
# URL for PostgreSQL database (verify the host, port, and database name)
spring.datasource.username=${DB_USERNAME:postgres}
# Your PostgreSQL username (use environment variable in production)
spring.datasource.password=${DB_PASSWORD:admin}
# Your PostgreSQL password (use environment variable in production)
spring.datasource.driver-class-name=org.postgresql.Driver
# PostgreSQL driver class name
spring.datasource.hikari.connection-timeout=30000
# Connection timeout in milliseconds (adjust if necessary)
spring.datasource.hikari.maximum-pool-size=10
# Maximum number of connections in the connection pool
spring.datasource.hikari.idle-timeout=600000
# Idle connection timeout in milliseconds (adjust if necessary)

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Hibernate JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Hibernate dialect for PostgreSQL
spring.jpa.hibernate.ddl-auto=none
# Specify the dialect for PostgreSQL in Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize schema and data
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql

# CORS Configuration
spring.mvc.cors.allowed-origins=http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

# Database logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-on-validation-error=true
spring.flyway.clean-disabled=false
# Automatically update the schema (use with caution in production)

# Hibernate Default Schema (optional)
spring.jpa.properties.hibernate.default_schema=public
# Default schema for Hibernate (optional, defaults to 'public')

# Logging Configuration
logging.level.org.springframework.security=DEBUG
# Log Spring Security events (useful for debugging)

# Disable Spring Boot Banner (optional)
spring.main.banner-mode=off
# Disables the Spring Boot startup banner

# Error Page Configuration
server.error.whitelabel.enabled=true
# Enable default error pages for unhandled errors

# Thymeleaf Configuration (if using Thymeleaf for templates)
spring.thymeleaf.cache=false
# Disable Thymeleaf template cache (useful in development)
spring.thymeleaf.prefix=classpath:/templates/
# Location of Thymeleaf templates
spring.thymeleaf.suffix=.html
# Suffix for Thymeleaf templates
spring.thymeleaf.mode=HTML
# Thymeleaf mode for processing templates (HTML mode)
spring.thymeleaf.encoding=UTF-8
# Template encoding (UTF-8 for wide character support)

# Spring DevTools Configuration (optional, for automatic restarts and live reload)
spring.devtools.restart.enabled=true
# Enable automatic restarts in development mode
spring.devtools.livereload.enabled=true
# Enable LiveReload for browser auto-refresh in development mode

# Allow Bean Definition Overriding (optional for specific cases)
spring.main.allow-bean-definition-overriding=true
# Allows overriding of bean definitions in Spring context

# Spring Security Dispatcher Configuration
spring.security.filter.dispatcher-types=REQUEST,ASYNC
# Configures request dispatching types for Spring Security

# JWT Configuration (consider environment variable or secret vault for production)
jwt.secret=${JWT_SECRET:YourSuperSecure512BitKeyHere12345678901234567890123456789012345678901234567890sdgdafhdhdfhadfhadfhaddhafahddhahdf}
# JWT secret key (ensure it is securely stored in production)
jwt.expiration=36000000000
# JWT expiration time in milliseconds (adjust as necessary)

# Additional Logging Configuration
logging.level.org.springframework.security=DEBUG
# Enable detailed logging for Spring Security

# File Upload Configuration
file.upload-dir=uploads
# Directory where uploaded profile pictures are stored
